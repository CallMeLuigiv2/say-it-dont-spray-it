[project]
name = "grokbot"
version = "0.1.0"
description = "Talk to Claude Code out loud, on your Claude plan: local speech recognition and voice, hands-free."
readme = "README.md"
authors = [
    { name = "CallMeLuigiV2", email = "202324608+CallMeLuigiv2@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    "pysilero-vad>=3.4.0",
    "rich>=15.0.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
grokbot = "grokbot.cli:main"

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
